name: ai_photoframe

services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - path: deploy/env/postgres.env
        required: false
    environment:
      POSTGRES_DB: photoframe
      POSTGRES_USER: photoframe
      POSTGRES_PASSWORD: photoframe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      llm-egress:
        condition: service_started
      xray-client:
        condition: service_started
    env_file:
      - path: deploy/env/backend.env.example
        required: false
      - path: backend/.env
        required: true
    environment:
      DB__HOST: postgres
      DB__PORT: "5432"
      DB__NAME: photoframe
      DB__USER: photoframe
      DB__PASSWORD: photoframe
      ROUTING_LLM_EGRESS_URL: http://llm-egress:8080
      ROUTING_XRAY_CLIENT_URL: http://xray-client:8081
      BACKEND_RELOAD: "false"
      BACKEND_PORT: "8000"
    ports:
      - "18081:8000"
    volumes:
      - ./backend:/app/backend
      - backend_venv:/app/backend/.venv
      - backend_storage:/app/backend/storage
      - backend_logs:/app/backend/logs
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    environment:
      FRONTEND_MODE: dev
      FRONTEND_PORT: "4173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    expose:
      - "4173"
    restart: unless-stopped

  xray-client:
    build:
      context: .
      dockerfile: deploy/docker/xray-client.Dockerfile
    expose:
      - "8081"
      - "10808"
      - "10809"
    restart: unless-stopped

  llm-egress:
    build:
      context: .
      dockerfile: deploy/docker/llm-egress.Dockerfile
    depends_on:
      - xray-client
    environment:
      XRAY_HTTP_PROXY: http://xray-client:10809
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/nginx.Dockerfile
    depends_on:
      - backend
      - frontend
    ports:
      - "18080:80"
    restart: unless-stopped

volumes:
  postgres_data:
    name: ai_photoframe_postgres_data
  backend_storage:
    name: ai_photoframe_backend_storage
  backend_logs:
    name: ai_photoframe_backend_logs
  backend_venv:
    name: ai_photoframe_backend_venv
  frontend_node_modules:
    name: ai_photoframe_frontend_node_modules
