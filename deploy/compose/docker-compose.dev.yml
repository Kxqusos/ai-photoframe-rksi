services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - path: ../env/postgres.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photoframe}
      POSTGRES_USER: ${POSTGRES_USER:-photoframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photoframe}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../env/backend.env
        required: false
    environment:
      APP__NAME: ${APP__NAME:-AI Photoframe API}
      APP__ENV: ${APP__ENV:-docker}
      APP__DEFAULT_PUBLIC_ROOM_SLUG: ${APP__DEFAULT_PUBLIC_ROOM_SLUG:-ph000000}
      AUTH__JWT_SECRET: ${AUTH__JWT_SECRET:-replace-me}
      AUTH__JWT_EXPIRE_MINUTES: ${AUTH__JWT_EXPIRE_MINUTES:-60}
      AUTH__ADMIN_USERNAME: ${AUTH__ADMIN_USERNAME:-admin}
      AUTH__ADMIN_PASSWORD: ${AUTH__ADMIN_PASSWORD:-change-me}
      DB__HOST: ${DB__HOST:-postgres}
      DB__PORT: ${DB__PORT:-5432}
      DB__NAME: ${DB__NAME:-photoframe}
      DB__USER: ${DB__USER:-photoframe}
      DB__PASSWORD: ${DB__PASSWORD:-photoframe}
      DB__ECHO: ${DB__ECHO:-false}
      LOG__FILE_PATH: ${LOG__FILE_PATH:-/app/backend/logs/backend.log}
      LOG__LEVEL: ${LOG__LEVEL:-INFO}
      OPENROUTER__API_KEY: ${OPENROUTER__API_KEY:-your_openrouter_api_key}
      OPENROUTER__HTTP_REFERER: ${OPENROUTER__HTTP_REFERER:-https://example.com}
      OPENROUTER__X_TITLE: ${OPENROUTER__X_TITLE:-AI Photoframe}
      OPENROUTER__PROVIDER_SORT: ${OPENROUTER__PROVIDER_SORT:-throughput}
      OPENROUTER__PREFERRED_MAX_LATENCY: ${OPENROUTER__PREFERRED_MAX_LATENCY:-25}
      OPENROUTER__SOURCE_MAX_SIDE: ${OPENROUTER__SOURCE_MAX_SIDE:-1280}
      OPENROUTER__SOURCE_JPEG_QUALITY: ${OPENROUTER__SOURCE_JPEG_QUALITY:-85}
      OPENROUTER__MISSING_IMAGE_RETRIES: ${OPENROUTER__MISSING_IMAGE_RETRIES:-3}
      OPENROUTER__RESULT_FORMAT: ${OPENROUTER__RESULT_FORMAT:-jpeg}
      OPENROUTER__JPEG_QUALITY: ${OPENROUTER__JPEG_QUALITY:-85}
      STORAGE__MEDIA_DIR: ${STORAGE__MEDIA_DIR:-/app/backend/storage}
      STORAGE__RESULT_RETENTION_DAYS: ${STORAGE__RESULT_RETENTION_DAYS:-7}
      BACKEND_RELOAD: "true"
      BACKEND_PORT: "8000"
    ports:
      - "18081:8000"
    volumes:
      - ../../backend:/app/backend
      - backend_venv:/app/backend/.venv
      - backend_storage:/app/backend/storage
      - backend_logs:/app/backend/logs
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    environment:
      FRONTEND_MODE: dev
      FRONTEND_PORT: "4173"
    volumes:
      - ../../frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    expose:
      - "4173"
    restart: unless-stopped

  nginx:
    build:
      context: ../..
      dockerfile: deploy/docker/nginx.Dockerfile
    depends_on:
      - backend
      - frontend
    ports:
      - "18080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:
  backend_logs:
  backend_venv:
  frontend_node_modules:
