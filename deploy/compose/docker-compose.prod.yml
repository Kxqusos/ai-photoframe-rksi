services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ../env/postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../env/backend.env
    environment:
      BACKEND_RELOAD: "false"
      BACKEND_PORT: "8000"
    expose:
      - "8000"
    volumes:
      - backend_storage:/app/backend/storage
      - backend_logs:/app/backend/logs
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    environment:
      FRONTEND_MODE: static
      FRONTEND_PORT: "4173"
    expose:
      - "4173"
    restart: unless-stopped

  nginx:
    build:
      context: ../..
      dockerfile: deploy/docker/nginx.Dockerfile
    depends_on:
      - backend
      - frontend
    ports:
      - "18080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:
  backend_logs:
